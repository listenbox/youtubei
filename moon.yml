language: rust
toolchains:
  default: system
tasks:
  lint:
    script: cargo fmt --all && pkgx +cmake.org cargo clippy --locked --all-targets -- -D warnings
  test:
    command: pkgx +cmake.org cargo test --locked
  build:
    command: pkgx +cmake.org cargo build --locked
  check:
    deps: [~:lint, ~:test, ~:build]
    options:
      runInCI: false
